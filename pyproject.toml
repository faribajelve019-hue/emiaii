[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "emiAi"
version = "0.1.0"
description = "Official Python SDK for EmiAI API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
